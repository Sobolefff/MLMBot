version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - app-data:/app/data
    depends_on:
      - redis
    ports:
      # Только на localhost хоста: наружу REST API не нужен - бот ходит в
      # него из своего контейнера по внутренней docker-сети (http://app:3000),
      # 127.0.0.1 нужен только для healthcheck/локальной проверки curl'ом.
      # Если позже понадобится доступ снаружи (например, nginx на другой
      # машине), замените на '3000:3000'.
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ['node', 'src/bot/index.js']
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - app-data:/app/data
    depends_on:
      - app
      - redis
      - telegram-bot-api

  # Опционально: self-hosted Bot API сервер. Снимает лимит облачного
  # api.telegram.org в 20 МБ на скачивание файлов ботом (getFile) — без него
  # партнёры не смогут прислать боту PDF-каталог тяжелее 20 МБ (см. README
  # "Self-hosted Bot API сервер"). Требует TELEGRAM_API_ID/TELEGRAM_API_HASH
  # в .env (https://my.telegram.org/apps) и TELEGRAM_API_ROOT=http://telegram-bot-api:8081.
  # Если не нужен — можно убрать этот сервис и depends_on выше, оставив
  # TELEGRAM_API_ROOT по умолчанию (https://api.telegram.org).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ['node', 'src/bot/worker.js']
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - app-data:/app/data
    depends_on:
      - app
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  app-data:
  redis-data:
  telegram-bot-api-data:
